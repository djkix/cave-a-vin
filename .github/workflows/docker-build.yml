name: Build and publish images
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  workflow_call:
    inputs:
      tag: { description: "Version tag (e.g. v0.1.0)", required: true, type: string }

permissions: { contents: read, packages: write }

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: "docker-build-${{ matrix.image }}", cancel-in-progress: false }
    strategy:
      matrix:
        include:
          - { image: api, context: ./api }
          - { image: web, context: ./web }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.sha }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}";
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}";
          else TAG=""; fi
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Le libellé affiché dans l'application. Pour une image taguée c'est le
          # numéro de version publié ; pour une image `latest` construite depuis
          # main, ce numéro suivi de l'empreinte du commit — sinon l'application
          # annoncerait la dernière version publiée alors qu'elle fait tourner des
          # changements non publiés.
          if [ -n "$TAG" ]; then echo "display=${TAG#v}" >> "$GITHUB_OUTPUT";
          else echo "display=$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ steps.version.outputs.value != '' }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VITE_APP_VERSION=${{ steps.version.outputs.display }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
